<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!--
    Used as a CSS mask, not as an image, so it inherits the theme colour and
    needs only one file for light and dark. Shapes stay clear of the tile edges
    so it repeats without visible seams.

    The motif is a loose scatter of puzzle tiles, echoing the emoji score grids
    the app is built around.
  -->
  <g fill="#000">
    <rect x="8" y="10" width="13" height="13" rx="3.5" opacity=".85" />
    <rect x="27" y="10" width="13" height="13" rx="3.5" opacity=".45" />

    <rect x="66" y="22" width="13" height="13" rx="3.5" opacity=".7" />
    <rect x="112" y="14" width="13" height="13" rx="3.5" opacity=".5" />
    <rect x="131" y="14" width="13" height="13" rx="3.5" opacity=".8" />

    <rect x="42" y="47" width="13" height="13" rx="3.5" opacity=".6" />
    <rect x="95" y="52" width="13" height="13" rx="3.5" opacity=".85" />
    <rect x="14" y="66" width="13" height="13" rx="3.5" opacity=".5" />

    <rect x="122" y="70" width="13" height="13" rx="3.5" opacity=".65" />
    <rect x="60" y="82" width="13" height="13" rx="3.5" opacity=".8" />
    <rect x="79" y="82" width="13" height="13" rx="3.5" opacity=".4" />

    <rect x="30" y="104" width="13" height="13" rx="3.5" opacity=".75" />
    <rect x="104" y="106" width="13" height="13" rx="3.5" opacity=".55" />
    <rect x="134" y="120" width="13" height="13" rx="3.5" opacity=".7" />

    <rect x="9" y="132" width="13" height="13" rx="3.5" opacity=".5" />
    <rect x="66" y="134" width="13" height="13" rx="3.5" opacity=".85" />
    <rect x="85" y="134" width="13" height="13" rx="3.5" opacity=".45" />
  </g>
</svg>
